services:
  teams-ai-assistant:
    build:
      context: .
      args:
        # Container identity MUST match the host machine where the Teams
        # browser login was done (msteams-mcp encrypts the session with
        # hostname:username). Set TEAMS_APP_USER/UID/GID/HOSTNAME in .env.
        APP_USER: ${TEAMS_APP_USER:-vnogueira}
        APP_UID: ${TEAMS_APP_UID:-1001}
        APP_GID: ${TEAMS_APP_GID:-1001}
    image: teams-ai-assistant:latest
    container_name: teams-ai-assistant
    hostname: ${TEAMS_HOSTNAME:-PDM-01642}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_UID: ${TEAMS_APP_UID:-1001}
      APP_GID: ${TEAMS_APP_GID:-1001}
    ports:
      - "3000:3000"   # remove/limit if you proxy via reverse proxy only
    volumes:
      - ./data:/app/data
      # msteams-mcp checkout (built on the host: npm install && npm run build).
      # Read-only: the app only runs its CLI against it.
      - ${MSTEAMS_MCP_PATH_HOST:-/opt/msteams-mcp}:/opt/msteams-mcp:ro
      # Teams browser session (SENSITIVE credentials). Persisted outside the
      # image; created/refreshed by the manual login step on the host.
      - ./teams-session:/app/teams-session
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
